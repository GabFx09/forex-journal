name: Stock Digest Harian

on:
  workflow_dispatch:  # triggered by cron-job.org (07:00 WIB = 00:00 UTC) setiap hari

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python ──────────────────────────────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r "files stock/requirements.txt"

      # ── 3. Buat config_email.ini dari secrets ──────────────────────────────────
      - name: Write config_email.ini
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SEND_TO:            ${{ secrets.SEND_TO }}
        run: |
          cat > "files stock/config_email.ini" << EOF
          [email]
          sender     = $GMAIL_USER
          password   = $GMAIL_APP_PASSWORD
          recipient  = $SEND_TO
          smtp_host  = smtp.gmail.com
          smtp_port  = 587
          EOF

      # ── 4. Jalankan digest ─────────────────────────────────────────────────────
      - name: Run stock digest
        run: python "files stock/stock_news_digest.py" --run-now

      # ── 5. Push hasil JSON + JS ke GitHub ─────────────────────────────────────
      - name: Commit & push data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "files stock/kalender.json" "files stock/sentimen.json" "files stock/geopolitik.json"
          git add "files stock/stock_analysis_data.js"
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan data, skip commit."
          else
            git commit -m "chore: stock digest $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi

      # ── 6. Siapkan folder deploy (HTML utama jadi index.html) ─────────────────
      - name: Siapkan folder deploy
        run: |
          mkdir -p _deploy
          cp "files stock/StockJournal_Pro.html" _deploy/index.html
          cp "files stock/stock_analysis_data.js" _deploy/
          cp "files stock/manifest.json"          _deploy/
          cp "files stock/sw.js"                  _deploy/
          cp "files stock/icon-192.png"           _deploy/
          cp "files stock/icon-512.png"           _deploy/
          cp "files stock/_headers"               _deploy/
          for f in kalender.json sentimen.json geopolitik.json; do
            [ -f "files stock/$f" ] && cp "files stock/$f" _deploy/ || true
          done
          echo "Isi folder deploy:"
          ls -lh _deploy/

      # ── 7. Deploy ke GitHub Pages (branch gh-pages, subfolder /stock/) ────────
      - name: Deploy ke GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_deploy
          publish_branch: gh-pages
          destination_dir: stock
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: stock update $(date -u +%Y-%m-%d)'
