name: Forex News Digest Harian

on:
  workflow_dispatch:  # triggered by cron-job.org (07:00 & 22:00 WIB)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Setup Python 3.11
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install dependensi
      - name: Install dependensi Python
        run: pip install -r requirements.txt

      # 4. Jalankan script utama
      - name: Jalankan forex_news_digest.py
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SEND_TO:            ${{ secrets.SEND_TO }}
          JSON_DIR:           "${{ github.workspace }}/files-forex"
        run: python forex_news_digest.py

      # 5. Commit & push file JSON yang baru di-generate
      - name: Commit dan push data JSON terbaru
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            "files-forex/kalender.json" \
            "files-forex/sentimen.json" \
            "files-forex/geopolitik.json" \
            "files-forex/news_data.js" \
            "files-forex/_headers"
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan data, skip commit."
          else
            git commit -m "chore: update data forex $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi

      # 6. Siapkan folder deploy (HTML utama jadi index.html + PWA assets)
      - name: Siapkan folder deploy
        run: |
          mkdir -p _deploy
          cp files-forex/ForexJournal_GoogleSheets.html _deploy/index.html
          cp files-forex/kalender.json   _deploy/
          cp files-forex/sentimen.json   _deploy/
          cp files-forex/geopolitik.json _deploy/
          cp files-forex/news_data.js    _deploy/
          cp files-forex/manifest.json   _deploy/
          cp files-forex/sw.js           _deploy/
          cp files-forex/icon-192.png    _deploy/
          cp files-forex/icon-512.png    _deploy/
          cp files-forex/_headers        _deploy/
          echo "Isi folder deploy:"
          ls -lh _deploy/

      # 7. Deploy ke GitHub Pages (branch gh-pages)
      - name: Deploy ke GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_deploy
          publish_branch: gh-pages
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: forex update $(date -u +%Y-%m-%d)'
