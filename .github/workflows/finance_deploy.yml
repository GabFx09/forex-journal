name: Deploy Finance ke GitHub Pages

on:
  push:
    branches: [main]
    paths: ['files-finance/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Siapkan folder deploy
        run: |
          mkdir -p _deploy
          cp files-finance/FinanceJournal_Pro.html _deploy/index.html
          echo "Isi folder deploy:"
          ls -lh _deploy/

      - name: Deploy ke GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_deploy
          publish_branch: gh-pages
          destination_dir: finance
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
